<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }}</title>
  <style>{{ report_css | safe }}</style>
</head>
<body>
  <header class="masthead">
    <div class="masthead__row">
      <h1>{{ heading }}</h1>
      <p class="masthead__date">{{ period_label }}</p>
    </div>
    <p class="masthead__note">{% block masthead_note %}{% endblock %}</p>
  </header>
  <main class="document">
    {% block content %}{% endblock %}
  </main>
  <footer class="colophon">
    <p>単日の値だけでなく、継続的な傾向を見て判断しましょう。</p>
    <p>記録がない項目は0ではなく欠損として扱い、グラフでも線をつなぎません。</p>
  </footer>
  <script id="report-data" type="application/json">{{ {"kind": report_kind, "trend": trend} | tojson }}</script>
  <script>{{ chart_js | safe }}</script>
  <script>{{ report_js | safe }}</script>
</body>
</html>
